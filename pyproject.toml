[project]
name = "outlook-mcp"
version = "0.1.48"
description = "MCP server for Microsoft 365 / Outlook.com mail, calendar, contacts and tasks (Microsoft Graph & EWS backends, stdio/HTTP transports)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "exchangelib>=5.6,<6",
    "mcp>=1.27,<2",
    "msal>=1.36,<2",
    "python-multipart>=0.0.20,<1",
    "requests>=2.32,<3",
    "starlette>=0.50,<1",
    "uvicorn>=0.38,<1",
]

[project.scripts]
outlook-mcp = "outlook_mcp.server:main"
outlook-mcp-http = "outlook_mcp.http_server:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "nodejs: tests that require Node.js runtime",
]
